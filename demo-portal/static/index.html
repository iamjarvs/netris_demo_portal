<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Command Center</title>
  
  <!-- Typography per common-ui-guidelines: Outfit font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN configured with TailAdmin v2 / common-ui-guidelines tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            coral: {
              25: '#FFF0F4',
              50: '#FFE5EC',
              100: '#FFCCD9',
              200: '#FC9CB4',
              300: '#FB6A8E',
              400: '#FF4D79',
              500: '#FF3366', // non-text only
              600: '#E60039', // primary interactive
              700: '#C20030', // hover / active
              800: '#9F042B',
              900: '#7E0724',
              950: '#4B0617',
            },
            success: {
              50: '#ECFDF3',
              500: '#12B76A',
              600: '#039855',
            },
            warning: {
              50: '#FFFAEB',
              500: '#F79009',
              600: '#DC6803',
            },
            error: {
              50: '#FEF3F2',
              500: '#F04438',
              600: '#D92D20',
            },
            info: {
              50: '#F0F9FF',
              500: '#0BA5EC',
              600: '#0086C9',
            }
          },
          boxShadow: {
            'theme-xs': '0px 1px 2px 0px rgba(16,24,40,0.05)',
            'theme-sm': '0px 1px 3px 0px rgba(16,24,40,0.10), 0px 1px 2px 0px rgba(16,24,40,0.06)',
            'theme-md': '0px 4px 8px -2px rgba(16,24,40,0.10), 0px 2px 4px -2px rgba(16,24,40,0.06)',
            'theme-lg': '0px 12px 16px -4px rgba(16,24,40,0.08), 0px 4px 6px -2px rgba(16,24,40,0.03)',
            'focus-coral': '0px 0px 0px 4px rgba(255,51,102,0.12)',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Xterm.js for Interactive Terminal Emulation -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #F9FAFB;
      color: #344054;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F2F4F7;
    }
    ::-webkit-scrollbar-thumb {
      background: #D0D5DD;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #98A2B3;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-700">
  <div id="root"></div>

  <!-- Main React Application Script with cache-busting -->
  <script type="text/babel" src="/static/app.js?v=1.2.0"></script>
</body>
</html>
