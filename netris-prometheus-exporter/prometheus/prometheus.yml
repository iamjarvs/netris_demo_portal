global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "netris"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["netris-exporter:9101"]
        labels:
          environment: "production"
          controller: "adam-ctl.netris.io"
